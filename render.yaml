services:
  - type: web
    name: freshfold-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: freshfold-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: freshfold-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: freshfold-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: freshfold-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: freshfold-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false

databases:
  - name: freshfold-db
    databaseName: freshfold
    user: freshfold
