spring.application.name=freshfold-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freshfold?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:freshfold}
spring.datasource.password=${DB_PASSWORD:freshfold}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=always
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
