spring.application.name=freshfold-api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:freshfold}?currentSchema=${DB_SCHEMA:freshfold}
spring.datasource.username=${DB_USER:freshfold}
spring.datasource.password=${DB_PASSWORD:freshfold}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:freshfold}
spring.flyway.schemas=${DB_SCHEMA:freshfold}
spring.flyway.create-schemas=true
server.error.include-message=always
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
