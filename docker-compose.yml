services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshfold
      POSTGRES_USER: freshfold
      POSTGRES_PASSWORD: freshfold
    ports:
      - "5432:5432"
    volumes:
      - freshfold_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshfold -d freshfold"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  freshfold_postgres:
