services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: freshfold
      MYSQL_USER: freshfold
      MYSQL_PASSWORD: freshfold
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - freshfold_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  freshfold_mysql:

